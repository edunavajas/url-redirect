version: '3.9'

volumes:
  pg_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=urlredirect
      - POSTGRES_PASSWORD=urlredirect
      - POSTGRES_DB=urlredirect
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlredirect -d urlredirect"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redirector:
    build:
      context: .
      dockerfile: Dockerfile.redirector
    container_name: url-redirector
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgres://urlredirect:urlredirect@postgres:5432/urlredirect
      - IP_SALT=${IP_SALT:-dev-salt-change-me}
      - REDIRECT_BASE_URL=${REDIRECT_BASE_URL:-http://localhost:3000}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-http://localhost:3001}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: url-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      - DATABASE_URL=postgres://urlredirect:urlredirect@postgres:5432/urlredirect
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - REDIRECT_BASE_URL=${REDIRECT_BASE_URL:-http://localhost:3000}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-http://localhost:3001}
      - ADMIN_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
